<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#282b1d" />
    <title>Nightshift Café</title>
  </head>
  <body>
    <main class="cabinet" aria-label="Nightshift Café">
      <div id="game" aria-label="タップできる店舗ビュー"></div>
      <header class="hud">
        <div class="shop"><i class="moon" aria-hidden="true">☾</i><div>
          <h1>Nightshift Café</h1>
          <span class="stars" id="rating" aria-label="店舗評価">★★★☆☆</span>
        </div></div>
        <div class="badge xp-badge"><strong id="level">Lv. 1</strong><div class="xp">
          <progress id="xp" value="0" max="24" aria-label="経験値"></progress><span id="xp-label">0 / 24 XP</span>
        </div></div>
        <div class="badge money"><i aria-hidden="true">$</i><div><span>所持金</span><strong id="coins">120</strong></div></div>
        <div class="badge vial"><i aria-hidden="true">◆</i><div><span>毒素</span><strong id="toxin">3</strong></div></div>
      </header>
      <p class="rotate-hint">横向きにすると、店全体を見渡せます</p>
      <nav class="tools" aria-label="店舗メニュー">
        <button type="button" id="kitchen" aria-label="コンロ" aria-expanded="false"><i class="tool-icon fire" aria-hidden="true">♨</i><span id="stove-label">コンロ</span></button>
        <button type="button" id="counter" aria-label="カウンター" aria-expanded="false"><i class="tool-icon plate" aria-hidden="true">◉</i><span id="stock">在庫 0</span></button>
        <button type="button" id="crew" aria-label="従業員" aria-expanded="false"><i class="tool-icon zombie" aria-hidden="true"><b></b></i><span id="crew-label">従業員 1/3</span></button>
        <button type="button" id="visitors" aria-label="来客" aria-expanded="false"><i class="tool-icon human" aria-hidden="true"><b></b></i><span id="visitors-label">来客 0</span></button>
      <button type="button" id="shop" aria-label="家具ショップ" aria-expanded="false"><i aria-hidden="true">▣</i><span>ショップ</span></button></nav>
      <div class="utility" aria-label="店舗とカメラ">
        <button type="button" id="time-mode" aria-label="時間モードを切り替え" aria-pressed="false">通常時間</button>
        <button type="button" id="store-toggle" aria-pressed="true" title="新規のお客様の受付">営業中</button>
        <button type="button" id="zoom-in" aria-label="拡大">+</button>
        <button type="button" id="zoom-out" aria-label="縮小">−</button>
        <button type="button" id="zoom-reset" aria-label="視点をリセット">⌂</button>
        <button type="button" id="debug" aria-label="経路を表示" aria-pressed="false">⌘</button>
      </div>
      <section id="details" class="details" aria-labelledby="details-title" hidden>
        <header class="detail-header">
          <h2 id="details-title"></h2>
          <button type="button" id="close-details" aria-label="メニューを閉じる">×</button>
        </header>
        <div id="detail-body" class="detail-body"></div>
      </section>
      <footer class="ticker">
        <p id="notice" role="status"></p>
        <p class="tally">会計 <b id="served">0</b><span>　売上 <b id="sales">0</b></span></p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
